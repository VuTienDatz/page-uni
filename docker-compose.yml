services:
  # Development service (mặc định với hot-reload, không cần cài node_modules ở máy thật)
  dev:
    container_name: page-uni-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - WATCHPACK_POLLING=true

  # Production service (bản build độc lập, siêu nhẹ và tối ưu)
  prod:
    container_name: page-uni-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    profiles:
      - prod
